name: evals

# Every push and every pull request. No API key, no secrets, no network.
# The whole suite replays from the cassettes committed in evals/cassettes,
# so it costs nothing and gives the same answer every time.

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Pinned on purpose. An unpinned ruff turns a new release into a red
      # build on a commit that changed nothing, which is how you teach people
      # to ignore CI.
      - name: Install
        run: pip install ruff==0.17.3 nbformat==5.11.1

      # Notebooks included. They are code that ships, and the cells in
      # notebooks/ are written to pass rather than excluded from the check.
      - name: Ruff
        run: ruff check .

      # The notebook is generated. That only means something if nothing can
      # edit the committed file without the builder changing too.
      - name: Notebook matches its builder
        run: python notebooks/check_notebook.py

  evals:
    name: Reproduce the published numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the evaluation suite against the baseline
        run: python -m evals.run_evals
